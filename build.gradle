plugins { id 'java' }
group = 'dev.rylune'
version = '0.3.0-alpha'
repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral() }
dependencies {
    compileOnly files('.gradle/rylune-game/client-intermediary.jar')
    compileOnly fileTree(dir: '.gradle/rylune-game/libs', include: '**/*.jar')
    compileOnly 'net.fabricmc:fabric-loader:0.16.14'
    compileOnly 'net.fabricmc:sponge-mixin:0.15.5+mixin.0.8.7'
    compileOnly 'org.lwjgl.lwjgl:lwjgl:2.9.3'
}
java { sourceCompatibility = JavaVersion.VERSION_1_8; targetCompatibility = JavaVersion.VERSION_1_8; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 8; options.encoding = 'UTF-8'; options.compilerArgs += ['-proc:none'] }
jar { from('LICENSE'); preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.register('selfTest', JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = 'dev.rylune.fabric.SelfTest' }
check.dependsOn selfTest

// Prepare official client classes before Gradle resolves the compile file tree.
tasks.register('prepareGame', Exec) {
    commandLine (System.getProperty('os.name').toLowerCase().contains('win') ? 'python' : 'python3'), 'tools/prepare_game.py'
}
compileJava.dependsOn prepareGame

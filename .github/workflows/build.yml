name: Build and release Rylune Fabric
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish or update the alpha prerelease (main branch only)'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - run: python3 tools/prepare_game.py
      - run: gradle --no-daemon clean build
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/verify_jar.py build/libs/RyluneFabric-1.8.9-0.3.0-alpha.jar
      - run: |
          mkdir -p release
          cp build/libs/*.jar release/
          git archive --format=zip --prefix=RyluneFabric-1.8.9/ -o release/RyluneFabric-Source.zip HEAD
          (cd release && sha256sum *.jar *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: RyluneFabric-1.8.9
          path: release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RyluneFabric-1.8.9
          path: release
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT: ${{ github.sha }}
        run: |
          tag=v0.3.0-alpha
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            test "$tag" = v0.3.0-alpha
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --target "$COMMIT" --title "Rylune Fabric $tag" --notes 'Experimental 1.8.9 generation-1 Legacy Fabric mod with portable JAR preflight/conversion and native feature routing. Not universal compatibility; in-game compatibility is not established.' --prerelease
          fi
